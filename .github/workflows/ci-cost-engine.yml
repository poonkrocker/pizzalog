name: CI — Cost Engine, Price List, Tools & PHP Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages and apps
        working-directory: frontend
        run: pnpm run typecheck

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP Syntax Check
        run: |
          find backend -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHP Backup Error Handling Integration Tests (SQLite)
        run: |
          php docs/audit/release-candidate/tests-php/test_workspace_backup_errors.php

      - name: Build required packages
        working-directory: frontend
        run: |
          pnpm --filter @pizzalog/cost-engine build
          pnpm --filter @pizzalog/price-list build

      - name: Build Pizzalog Tools Web Companion
        working-directory: frontend
        run: pnpm --filter @pizzalog/tools build

      - name: Verify Tools deployment parity with dist/ present
        working-directory: frontend
        run: |
          test -f apps/tools/dist/index.html
          pnpm --filter @pizzalog/cost-engine exec node --test tests/production-infra-7-2-to-7-7.test.mjs

      - name: Run all workspace test suites
        working-directory: frontend
        run: pnpm run test
